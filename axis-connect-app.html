<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AXIS Connect — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#f58220; --primary-d:#e0730f; --primary-soft:#fdecd9;
  --ink:#202020; --muted:#8f92a1; --grey:#787878; --line:#ececf0;
  --bg:#f2f2f2; --card:#ffffff; --link:#267dff; --red:#e40000; --green:#22c55e;
  --purple:#8b7cf6; --pink:#ff6fa5;
  --shadow:0 10px 30px rgba(30,32,40,.10);
  --shadow-nav:0 -4px 24px rgba(114,114,114,.14);
  --radius:18px;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:#20242d;color:var(--ink);
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:radial-gradient(1200px 800px at 20% -10%,#2c3340,#181b22 70%);padding:0}
/* device */
#device{position:relative;width:min(430px,100vw);height:min(920px,100vh);
  background:var(--bg);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.55);
  display:flex;flex-direction:column}
@media(min-width:480px) and (min-height:940px){
  #device{border-radius:44px;border:11px solid #0d0f13;height:900px}
}
/* status bar */
#statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:15px;font-weight:600;color:var(--ink);z-index:60;position:relative}
#statusbar.on-orange{color:#fff}
#statusbar .sb-r{display:flex;align-items:center;gap:6px}
#statusbar svg{display:block}
/* viewport that holds screens */
#viewport{position:relative;flex:1 1 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg)}
.screen.active{display:flex;animation:slideIn .28s cubic-bezier(.22,.7,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:16px}
/* ===== app header ===== */
.appbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 12px;background:var(--bg)}
.logo{font-weight:800;font-size:24px;letter-spacing:1px;color:#4a4f5a;display:flex;align-items:center;gap:9px}
.logo .x{color:var(--primary)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;border:none;display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(30,32,40,.08);cursor:pointer;position:relative;color:#33363e;flex:0 0 auto}
.iconbtn:active{transform:scale(.94)}
.appbar .right{display:flex;align-items:center;gap:10px}
.avatar{border-radius:50%;background-size:cover;flex:0 0 auto;display:grid;place-items:center;
  color:#fff;font-weight:600;overflow:hidden;background-position:center}
.dot-badge::after{content:'';position:absolute;top:9px;right:11px;width:8px;height:8px;border-radius:50%;
  background:var(--red);border:2px solid #fff}
/* ===== bottom nav ===== */
.tabbar{flex:0 0 auto;height:74px;background:#fff;box-shadow:var(--shadow-nav);
  display:flex;align-items:flex-start;justify-content:space-around;padding:12px 8px 0;position:relative;z-index:40}
.tabbar .tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:var(--font);font-size:11px;color:#b7bac2;cursor:pointer;width:70px;font-weight:500}
.tabbar .tab.active{color:var(--ink)}
.tabbar .tab.active svg{color:var(--ink)}
.tabbar .tab svg{color:#c2c5cd}
.tabbar .spacer{width:70px}
.fab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;
  background:var(--primary);border:5px solid var(--bg);display:grid;place-items:center;color:#fff;cursor:pointer;
  box-shadow:0 10px 22px rgba(245,130,32,.5);z-index:41}
.fab:active{transform:translateX(-50%) scale(.93)}
/* ===== generic sub header ===== */
.subhead{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:6px 16px 12px}
.subhead h1{font-size:22px;font-weight:700;margin:0;flex:1}
.subhead .act{margin-left:auto}
/* ===== cards / feed ===== */
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.section-title h2{font-size:20px;font-weight:700;margin:0}
.section-title a{color:var(--muted);font-size:13px;text-decoration:none;font-weight:500;display:flex;align-items:center;gap:2px}
.feat{background:#fff;border-radius:16px;padding:10px;display:flex;gap:12px;box-shadow:var(--shadow);align-items:center}
.feat .thumb{width:96px;height:76px;border-radius:12px;flex:0 0 auto;background-size:cover;background-position:center}
.feat .tag{color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.5px}
.feat h3{margin:3px 0 5px;font-size:13.5px;font-weight:600;line-height:1.35}
.feat .date{color:var(--muted);font-size:11px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:#d8d9de;display:block}
.dots i.on{width:20px;border-radius:6px;background:var(--primary)}
.post{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px}
.post .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post .head .nm{font-weight:600;font-size:14.5px}
.post .head .tm{color:var(--muted);font-size:12px}
.post .body{font-size:14px;line-height:1.5;color:#33363e;margin-bottom:10px}
.post .body .more{color:var(--muted);cursor:pointer}
.post .body .lnk{color:var(--link)}
.media{border-radius:12px;overflow:hidden;display:grid;gap:4px;margin-bottom:10px}
.media.one{grid-template-columns:1fr}
.media.two{grid-template-columns:1fr 1fr}
.media.three{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.media.three .m0{grid-row:1/3}
.media img,.media .m{width:100%;height:100%;object-fit:cover;display:block;min-height:96px}
.media .video{position:relative}
.media .video .play{position:absolute;inset:0;margin:auto;width:52px;height:52px;background:rgba(255,255,255,.9);
  border-radius:50%;display:grid;place-items:center}
.media .plus{position:relative}
.media .plus::after{content:attr(data-n);position:absolute;inset:0;background:rgba(20,22,28,.55);color:#fff;
  display:grid;place-items:center;font-size:22px;font-weight:600}
.likedby{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:6px 0}
.stack{display:flex}
.stack .avatar{margin-left:-8px;border:2px solid #fff}
.stack .avatar:first-child{margin-left:0}
.actions{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.actions button{background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--grey);
  font-family:var(--font);font-size:12.5px;cursor:pointer}
.actions button.liked{color:var(--red)}
.actions button.liked svg{fill:var(--red);color:var(--red)}
/* segmented */
.seg{display:flex;background:#fff;border-radius:30px;padding:5px;margin:2px 0 16px;box-shadow:var(--shadow)}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:24px;font-family:var(--font);
  font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.seg.underline{background:none;box-shadow:none;padding:0;border-bottom:1px solid var(--line);border-radius:0}
.seg.underline button{border-radius:0;padding:12px;color:var(--muted)}
.seg.underline button.on{background:none;color:var(--primary);border-bottom:2px solid var(--primary)}
/* trending news card */
.ncard{background:#fff;border-radius:14px;padding:10px;display:flex;gap:12px;box-shadow:var(--shadow);margin-bottom:12px}
.ncard .thumb{width:84px;height:84px;border-radius:10px;flex:0 0 auto;background-size:cover;background-position:center}
.ncard .cat{color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.4px}
.ncard h3{font-size:14px;font-weight:600;margin:4px 0 6px;line-height:1.35}
.ncard .date{color:var(--muted);font-size:11px}
/* login */
.auth{background:var(--primary);color:#fff}
.auth .net{height:250px;position:relative;flex:0 0 auto}
.auth .net svg{position:absolute;inset:0;width:100%;height:100%}
.auth .net .av{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.35);background-size:cover;background-position:center}
.auth .form{flex:1;padding:6px 26px 26px;display:flex;flex-direction:column}
.auth h1{font-size:30px;font-weight:700;margin:6px 0 10px}
.auth p{font-size:14px;line-height:1.5;color:rgba(255,255,255,.9);margin:0 0 26px}
.field{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;
  padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.field input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:var(--font);font-size:15px}
.field input::placeholder{color:rgba(255,255,255,.85)}
.auth .row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;margin-bottom:20px}
.auth .row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.auth .row .box{width:18px;height:18px;border:1.5px solid #fff;border-radius:5px}
.btn-white{background:#fff;color:var(--primary);border:none;border-radius:14px;padding:17px;font-family:var(--font);
  font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.btn-white:active{transform:scale(.98)}
.auth .alt{text-align:center;color:#fff;font-weight:600;font-size:14px;margin-top:18px;cursor:pointer}
.auth .grow{flex:1}
/* buttons */
.btn{background:var(--primary);color:#fff;border:none;border-radius:14px;padding:16px;font-family:var(--font);
  font-weight:600;font-size:15px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.99)}
/* profile */
.prof-top{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.prof-top .ava{position:relative}
.prof-top .cam{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;
  background:var(--primary);border:3px solid #fff;display:grid;place-items:center;color:#fff}
.prof-top h2{margin:14px 0 2px;font-size:21px;font-weight:700}
.prof-top .em{color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:12px;justify-content:center;margin:16px 0}
.chip{background:var(--primary-soft);color:#7a4a12;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:8px}
.info{display:flex;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.info .ic{color:var(--muted);flex:0 0 auto;margin-top:2px}
.info h4{margin:0 0 4px;font-size:15px;font-weight:600}
.info p{margin:0;color:var(--grey);font-size:13.5px;line-height:1.5}
.grp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.grp .nm{font-weight:600;font-size:14px}
.grp .mt{color:var(--muted);font-size:12px}
/* drawer */
#scrim{position:absolute;inset:0;background:rgba(20,22,28,.45);opacity:0;pointer-events:none;transition:.25s;z-index:70}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;left:0;bottom:0;width:82%;max-width:330px;background:#fff;z-index:71;
  transform:translateX(-104%);transition:transform .28s cubic-bezier(.22,.7,.3,1);display:flex;flex-direction:column;
  border-radius:0 24px 24px 0;box-shadow:20px 0 60px rgba(0,0,0,.25)}
#drawer.on{transform:none}
#drawer .dh{display:flex;align-items:center;gap:12px;padding:26px 22px 18px;border-bottom:1px solid var(--line)}
#drawer .dh .nm{font-weight:700;font-size:17px}
#drawer .dh .jn{color:var(--muted);font-size:12px}
#drawer .dh .iconbtn{margin-left:auto;width:36px;height:36px}
#drawer .dl{flex:1;overflow-y:auto;padding:10px 8px}
#drawer .dl::-webkit-scrollbar{width:0}
#drawer .di{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:12px;cursor:pointer;
  color:#3a3d45;font-weight:500;font-size:15px}
#drawer .di:active{background:var(--bg)}
#drawer .di svg{color:var(--grey)}
#drawer .logout{border-top:1px solid var(--line);padding:14px 24px 26px;display:flex;align-items:center;gap:16px;
  color:#3a3d45;font-weight:500;cursor:pointer}
/* chat list */
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:14px 18px;
  box-shadow:var(--shadow);margin-bottom:8px;color:var(--muted)}
.searchbar input{flex:1;border:none;outline:none;font-family:var(--font);font-size:14px;background:none}
.crow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.crow .nm{font-weight:600;font-size:14.5px}
.crow .pv{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .tm{margin-left:auto;color:var(--muted);font-size:11px;align-self:flex-start}
.crow .pv .rr{color:var(--link)}
/* chat thread */
.thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.thread::-webkit-scrollbar{width:0}
.bub{max-width:74%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.bub.them{background:#fff;align-self:flex-start;border-bottom-left-radius:5px;box-shadow:0 2px 8px rgba(30,32,40,.06)}
.bub.me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub .t{font-size:10px;opacity:.6;margin-top:4px;text-align:right}
.composer{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-top:1px solid var(--line)}
.composer .inp{flex:1;display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:24px;padding:10px 14px}
.composer input{flex:1;border:none;outline:none;background:none;font-family:var(--font);font-size:14px}
.composer .send{width:44px;height:44px;border-radius:50%;background:var(--primary);border:none;display:grid;place-items:center;color:#fff;cursor:pointer}
/* notifications */
.nsep{text-align:center;margin:8px 0}
.nsep span{background:#fff;color:var(--grey);font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;box-shadow:var(--shadow)}
.nrow{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 4px 14px rgba(30,32,40,.05)}
.nrow.unread{background:#e9f1ff}
.nrow .tx{font-size:13.5px;line-height:1.4}
.nrow .tx b{font-weight:600}
.nrow .tm{color:var(--muted);font-size:11.5px;margin-top:3px}
/* hrms */
.hcard{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.hcard h2{margin:0 0 4px;font-size:22px;font-weight:700}
.hcard .dt{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.hcard p{font-size:13.5px;line-height:1.5;margin:0 0 16px;color:#33363e}
.hbar{height:9px;border-radius:6px;background:#eceef2;display:flex;overflow:hidden;margin:14px 0}
.hbar i{display:block;height:100%}
.legend{display:flex;justify-content:space-between}
.legend div{font-size:12px;color:var(--grey)}
.legend .k{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:12px;margin-bottom:2px}
.legend .k i{width:9px;height:9px;border-radius:50%}
.leaverow{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.leaverow::-webkit-scrollbar{height:0}
.leavecard{flex:0 0 150px;background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);text-align:center}
.leavecard .lt{font-weight:600;font-size:14px}
.leavecard .lu{color:var(--muted);font-size:12px;margin-bottom:12px}
.ring{width:96px;height:96px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700}
.qa{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer}
.qa .qi{width:40px;height:40px;border-radius:11px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.qa .qn{font-weight:600;font-size:14.5px;flex:1}
/* add post */
.composer-screen textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--font);font-size:16px;
  min-height:160px;background:none;line-height:1.5}
.opt-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-top:1px solid var(--line);color:#3a3d45;font-size:14px;font-weight:500}
.opt-row .oi{color:var(--primary)}
/* toast */
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#202530;color:#fff;
  padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.3s;z-index:90;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-illustration{text-align:center;color:var(--muted);padding:40px 20px}
.list-title{font-size:15px;font-weight:700;margin:14px 2px 12px}
.evt{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.evt .cover{height:130px;background-size:cover;background-position:center;position:relative}
.evt .cover .dtag{position:absolute;top:12px;left:12px;background:#fff;border-radius:10px;padding:6px 10px;text-align:center;line-height:1}
.evt .cover .dtag b{font-size:17px;color:var(--primary)}
.evt .cover .dtag span{font-size:10px;color:var(--grey);display:block}
.evt .ec{padding:14px}
.evt .ec h3{margin:0 0 6px;font-size:15.5px;font-weight:600}
.evt .ec .mt{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);text-align:center;cursor:pointer}
.res .ri{width:52px;height:52px;border-radius:14px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary);margin:0 auto 12px}
.res .rn{font-weight:600;font-size:14px}
.res .rc{color:var(--muted);font-size:12px;margin-top:2px}
.colrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.colrow .nm{font-weight:600;font-size:14.5px}
.colrow .rl{color:var(--muted);font-size:12px}
.colrow .msgbtn{margin-left:auto;color:var(--primary);background:var(--primary-soft);border:none;border-radius:10px;padding:8px 14px;font-family:var(--font);font-weight:600;font-size:12.5px;cursor:pointer}
.fieldbox{background:#fff;border-radius:12px;padding:15px 16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(30,32,40,.05);display:flex;align-items:center;gap:10px}
.fieldbox input{flex:1;border:none;outline:none;font-family:var(--font);font-size:14.5px;background:none}
.fieldbox label{position:absolute}
.flabel{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 2px 7px}
/* leave cards */
.lvcard{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.lvcard .lh{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.lvcard .lh h3{margin:0;font-size:16px;font-weight:600}
.pill{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid}
.pill.pending{color:var(--primary);border-color:var(--primary);background:#fff6ef}
.pill.approved{color:#12b76a;border-color:#12b76a;background:#eafcf3}
.pill.rejected{color:var(--red);border-color:var(--red);background:#fdecec}
.lvcard .dr{color:var(--muted);font-size:13px;margin-bottom:6px}
.lvcard .de{color:var(--grey);font-size:13.5px;line-height:1.5}
.stickybtn{flex:0 0 auto;padding:14px 16px 18px;background:var(--bg);border-top:1px solid var(--line)}
.filterchip{display:inline-flex;align-items:center;gap:8px;background:var(--primary-soft);color:#7a4a12;border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:600;margin-bottom:16px}
.filterchip span{cursor:pointer;font-weight:700;font-size:14px;line-height:1}
.iconbtn.act{background:var(--primary);color:#fff}
/* payslips */
.yearbar{display:flex;gap:10px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.yearbar::-webkit-scrollbar{height:0}
.ypill{flex:0 0 auto;border:1.4px solid var(--line);background:#fff;border-radius:22px;padding:9px 22px;font-family:var(--font);font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.ypill.on{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 16px rgba(245,130,32,.3)}
.psrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer}
.psic{width:46px;height:46px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary);flex:0 0 auto}
.psm{font-weight:600;font-size:15px}
.psn{color:var(--muted);font-size:12.5px;margin-top:2px}
.psamt{font-weight:700;font-size:15px}
.ps-net{background:linear-gradient(135deg,#f7942f,#ec6a12);color:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 14px 30px rgba(245,130,32,.4)}
.ps-net .lbl{font-size:13px;opacity:.92}
.ps-net .amt{font-size:33px;font-weight:800;margin:2px 0 4px;letter-spacing:-.5px}
.ps-net .pd{font-size:12.5px;opacity:.92}
.ps-net .ps-meta{display:flex;gap:34px;margin-top:16px;border-top:1px solid rgba(255,255,255,.28);padding-top:14px}
.ps-net .ps-meta span{display:block;font-size:11px;opacity:.85}
.ps-net .ps-meta b{font-size:13px;font-weight:600}
.ps-sec{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.ps-sec h4{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.ps-sec h4 .d{width:8px;height:8px;border-radius:50%}
.ps-item{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;color:#3a3d45;border-bottom:1px solid var(--line)}
.ps-item span:last-child{font-weight:600;color:var(--ink)}
.ps-total{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px;border-top:2px solid var(--line);margin-top:4px;padding-top:12px}
.ps-final{display:flex;justify-content:space-between;align-items:center;background:var(--primary-soft);color:#7a4a12;border-radius:14px;padding:16px 18px;font-weight:700;font-size:15px}
.ps-final b{color:var(--primary);font-size:19px}
/* wheel date picker */
.dph{display:flex;justify-content:flex-end;margin-bottom:2px}
.dpick{position:relative;display:flex;height:230px;overflow:hidden;margin:6px 0 14px}
.dpband{position:absolute;left:0;right:0;top:92px;height:46px;background:var(--primary-soft);border-radius:12px;pointer-events:none}
.dpcol{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;text-align:center;padding:92px 0;position:relative;z-index:1}
.dpcol::-webkit-scrollbar{display:none}
.dpcol>div{height:46px;line-height:46px;scroll-snap-align:center;font-size:20px;color:#c3c6ce}
.dpcol>div.active{color:var(--ink);font-weight:700;font-size:22px}
/* holidays */
.holi{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.hdate{width:56px;height:56px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;text-align:center;flex:0 0 auto;line-height:1.1}
.hdate b{font-size:18px;color:var(--ink)}
.hdate span{font-size:11px;color:var(--primary);font-weight:600;text-transform:uppercase}
.holi .hn{font-weight:600;font-size:15px}
.holi .hw{color:var(--muted);font-size:12.5px;margin-top:2px}
/* calendar */
.calcard{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:700;font-size:16px}
.calhd .cn{background:none;border:none;color:var(--grey);cursor:pointer;padding:4px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;text-align:center}
.calgrid .dow{font-size:12px;color:var(--grey);font-weight:600;padding-bottom:4px}
.calgrid .cd{font-size:13.5px;padding:7px 0 9px;position:relative;color:var(--ink)}
.calgrid .cd.mut{color:#cfd2d8}
.calgrid .cd.sun{color:var(--red)}
.calgrid .cd i{position:absolute;left:22%;right:22%;bottom:3px;height:2.5px;border-radius:2px}
.calgrid .cd.p i{background:var(--green)}
.calgrid .cd.a i{background:var(--purple)}
.calgrid .cd.o i{background:var(--pink)}
.selectbox{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 14px rgba(30,32,40,.05);margin-bottom:16px;color:var(--muted);cursor:pointer}
.fromcard{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.fromcard h3{margin:0 0 12px;font-size:18px;font-weight:700}
.sessrow{display:flex;gap:24px;margin-top:12px}
.sessrow label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--primary);display:grid;place-items:center}
.radio.on::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--primary)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:75;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.7,.3,1);padding:20px;max-height:80%;overflow-y:auto;box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
#sheetScrim{position:absolute;inset:0;background:rgba(20,22,28,.45);opacity:0;pointer-events:none;transition:.25s;z-index:74}
#sheetScrim.on{opacity:1;pointer-events:auto}
/* forgot-password (white auth) screens */
.rscreen{background:#fff}
.rtop{flex:0 0 auto;padding:8px 16px 0}
.rbody{flex:1;overflow-y:auto;padding:6px 26px 26px;display:flex;flex-direction:column}
.rbody::-webkit-scrollbar{width:0}
.rillo{display:grid;place-items:center;margin:14px 0 28px}
.rbadge{width:150px;height:150px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.rscreen h1{font-size:29px;font-weight:700;margin:0 0 10px}
.rscreen .sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 28px}
.rscreen .sub .hl{color:var(--primary);font-weight:500}
.rinput{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;background:#fff}
.rinput input{flex:1;border:none;outline:none;font-family:var(--font);font-size:15px;background:none}
.rinput .ic{color:var(--muted);display:flex}
.otprow{display:flex;gap:14px;margin-bottom:16px}
.otprow input{width:100%;height:66px;border:1px solid var(--line);border-radius:14px;text-align:center;font-size:22px;font-weight:600;font-family:var(--font);outline:none}
.otprow input:focus{border-color:var(--primary)}
.rlink{text-align:center;color:var(--primary);font-weight:600;font-size:14px;margin-top:16px;cursor:pointer}
.fill{flex:1;min-height:20px}
/* onboarding (Splash 2) */
.onboard{background:var(--bg)}
.netbig{position:relative;height:530px;flex:0 0 auto;overflow:hidden}
.obring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1.4px dashed #d5d7dd;border-radius:50%}
.obring.r1{width:300px;height:300px}
.obring.r2{width:470px;height:470px}
.obring.r3{width:640px;height:640px}
.rdot{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.centerimg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:158px;height:158px;border-radius:50%;background:var(--primary);overflow:hidden;box-shadow:0 12px 30px rgba(245,130,32,.35)}
.centerimg div{width:100%;height:100%;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.05);mix-blend-mode:luminosity}
.sat{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background-size:cover;background-position:center 20%;filter:grayscale(1);border:3px solid #fff;box-shadow:0 6px 16px rgba(30,32,40,.14)}
.sat.pop{border:none;background-color:var(--primary)}
.sat.pop::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;background-image:inherit;background-size:cover;background-position:center 20%;filter:grayscale(1);mix-blend-mode:luminosity}
.ob-card{background:#fff;border-radius:26px 26px 0 0;padding:26px;margin-top:-18px;position:relative;z-index:2;box-shadow:0 -10px 30px rgba(30,32,40,.06)}
.ob-card h1{font-size:26px;font-weight:700;margin:0 0 8px}
.ob-card p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 22px}
.eng{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;margin-top:18px}
.eng .logo{font-size:19px}
.sheet h3{margin:0 0 16px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sheet .opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.sheet .opt.on{border-color:var(--primary)}
</style>
</head>

function renderPost(p){
  let media='';
  if(p.media){
    const cls=p.media.length===1?'one':p.media.length===2?'two':'three';
    media='<div class="media '+cls+'">'+p.media.map((s,i)=>{
      let inner=mediaBlock(s);
      if(p.video&&i===0)inner='<div class="video">'+mediaBlock(s)+'<div class="play">'+I.play+'</div></div>';
      if(cls==='three'&&i===2)inner='<div class="plus" data-n="+5">'+mediaBlock(s)+'</div>';
      return '<div class="'+(cls==='three'?'m'+i:'')+'" style="min-height:'+(cls==='one'?'190px':'110px')+'">'+inner+'</div>';
    }).join('')+'</div>';
  }
  const bodyText = p.link?('<span class="lnk">'+esc(p.x)+'</span>'+(p.x2?'<br><br>'+esc(p.x2)+' <span class="more">more</span>':'')):
    (esc(p.x)+(p.x.length>60?' <span class="more">more</span>':''))+(p.link2?'<br><span class="lnk">'+esc(p.link2)+'</span>':'');
  return `<div class="post">
    <div class="head">${av(p.n,44)}<div><div class="nm">${p.n}</div><div class="tm">${p.t}</div></div></div>
    <div class="body">${bodyText}</div>${media}
    <div class="likedby"><div class="stack">${av('a',22)}${av('b',22)}${av('c',22)}</div>Liked by ${p.likedby}</div>
    <div class="actions">
      <button class="likeBtn ${p.liked?'liked':''}" onclick="toggleLike(this)"><span class="ic">${I.heart}</span><span class="c">${p.likes}</span></button>
      <button onclick="toast('Comments')">${I.comment}<span>${p.comments!=null?p.comments+' Comment'+(p.comments===1?'':'s'):'Comment'}</span></button>
      <button onclick="toast('Share')">${I.share}<span>${p.shares!=null&&p.shares>0?p.shares+' Share'+(p.shares===1?'':'s'):'Share'}</span></button>
    </div></div>`;
}

/* ---------- HRMS: calendar + sheets + leave form ---------- */
function calendar(){
  const dow=['M','T','W','T','F','S','S'];
  const cells=[];
  [25,26,27,28,29,30].forEach(d=>cells.push({d,mut:true}));
  for(let d=1;d<=31;d++)cells.push({d,st:attDec[d]});
  let n=1;while(cells.length%7)cells.push({d:('0'+n++).slice(-2),mut:true});
  let html='<div class="calgrid">'+dow.map(d=>`<div class="dow">${d}</div>`).join('');
  cells.forEach((c,i)=>{
    const sun=(i%7===6);
    const cls='cd'+(c.mut?' mut':'')+(sun&&!c.mut?' sun':'')+(c.st?' '+c.st:'');
    html+=`<div class="${cls}">${c.d}${c.st?'<i></i>':''}</div>`;
  });
  return html+'</div>';
}

  openSheet(`<h3>Filter by Status <span class="iconbtn" style="width:34px;height:34px" onclick="closeSheet()">✕</span></h3>
   ${opts.map(o=>`<div class="opt${leaveFilter===o[0]?' on':''}" onclick="selOne(this);pendingFilter='${o[0]}'"><span class="radio${leaveFilter===o[0]?' on':''}"></span>${o[1]}</div>`).join('')}
   <button class="btn" style="margin-top:6px" onclick="applyLeaveFilter()">Apply Filter</button>`);
}
function applyLeaveFilter(){leaveFilter=pendingFilter;closeSheet();go('myleaves',true);}

/* ---------- wheel date picker ---------- */
const DP={days:Array.from({length:31},(_,i)=>i+1),
  months:['January','February','March','April','May','June','July','August','September','October','November','December'],
  years:[2023,2024,2025,2026,2027,2028,2029,2030]};
let dpTarget=null;
function openDatePicker(input){
  dpTarget=input;
  const col=(items,sel)=>`<div class="dpcol" data-sel="${sel}">${items.map((v,i)=>`<div class="${i===sel?'active':''}">${v}</div>`).join('')}</div>`;
  openSheet(`<div class="dph"><span class="iconbtn" style="width:34px;height:34px" onclick="closeSheet()">✕</span></div>
   <div class="dpick"><div class="dpband"></div>${col(DP.days,18)}${col(DP.months,11)}${col(DP.years,1)}</div>
   <button class="btn" onclick="applyDate()">Done</button>`);
  requestAnimationFrame(()=>{
    document.querySelectorAll('#sheet .dpcol').forEach(c=>{
      c.scrollTop=(+c.dataset.sel)*46;
      let t;c.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>dpSnap(c),60);dpHi(c);});
    });
  });
}
function dpHi(c){const idx=Math.round(c.scrollTop/46);c.dataset.sel=idx;[...c.children].forEach((d,i)=>d.classList.toggle('active',i===idx));}
function dpSnap(c){const idx=Math.round(c.scrollTop/46);c.scrollTo({top:idx*46,behavior:'smooth'});}
function applyDate(){
  const c=document.querySelectorAll('#sheet .dpcol');
  const d=DP.days[+c[0].dataset.sel],m=+c[1].dataset.sel+1,y=DP.years[+c[2].dataset.sel];
  if(dpTarget)dpTarget.value=String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'/'+y;
  closeSheet();
}

/* ---------- router ---------- */
const MAIN=['home','community','trending','hrms'];
const AUTH=['login','signup'];
let stack=['splash'];
let CURRENT_CHAT='Abhira Prabha';
const vp=document.getElementById('viewport');

function paint(id){
  vp.innerHTML=SCREENS[id]();
  requestAnimationFrame(()=>{const s=vp.querySelector('.screen');if(s)s.classList.add('active');});
  const orange=AUTH.includes(id);
  document.getElementById('statusbar').classList.toggle('on-orange', orange);
}
function go(id,replace){
  if(!SCREENS[id])return;
  if(replace)stack[stack.length-1]=id; else if(stack[stack.length-1]!==id)stack.push(id);
  closeDrawer();closeSheet();
  paint(id);
}
function back(){
  if(stack.length>1){stack.pop();paint(stack[stack.length-1]);}
}
function openChat(n){CURRENT_CHAT=n;go('chatthread');}

/* ---------- interactions ---------- */
function toggleLike(btn){
  const c=btn.querySelector('.c');let v=parseInt(c.textContent);
  if(btn.classList.toggle('liked')){c.textContent=v+1;}else{c.textContent=v-1;}
}
function sendMsg(){
  const inp=document.getElementById('msgInput');const v=inp.value.trim();if(!v)return;
  const th=document.getElementById('thread');
  const b=document.createElement('div');b.className='bub me';b.innerHTML=esc(v)+'<div class="t">now</div>';
  th.appendChild(b);inp.value='';th.scrollTop=th.scrollHeight;
  setTimeout(()=>{const r=document.createElement('div');r.className='bub them';r.innerHTML='Got it! 👍<div class="t">now</div>';th.appendChild(r);th.scrollTop=th.scrollHeight;},900);
}
function publishPost(){
  const t=document.getElementById('postText').value.trim();
  if(!t){toast('Write something first');return;}
  homeFeed.unshift({n:ME.name,t:'Just now',x:t,likes:0,likedby:'you'});
  toast('Post published ✓');go('home',true);
}
function segNews(btn,type){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');

  if(type==='news'){body.innerHTML=trendNews.map(n=>`<div class="ncard" onclick="toast('Opening article')"><div class="thumb" style="background-image:url(${scImg(n.s)});background-size:cover;background-position:center"></div><div style="flex:1"><div class="cat">${n.cat}</div><h3>${n.h}</h3><div class="date">${n.d}</div></div></div>`).join('');}
  else if(type==='poll'){body.innerHTML=pollHtml();}
  else{body.innerHTML=surveyHtml();}
}
